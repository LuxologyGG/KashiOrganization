<style>
  body{min-height:100svh;display:grid;place-items:center;background:#fff;color:var(--ink);text-align:center}

  .nf a.back{display:inline-flex;align-items:center;gap:.6em;margin-top:6px;font-family:var(--font-mono);font-size:var(--fs-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);border-bottom:1px solid rgba(110,82,37,.35);padding-bottom:4px}

  .nf a.back svg{width:14px;height:14px}
